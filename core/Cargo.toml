[workspace]
resolver = "2"
members = [
    "oniris-pack",
    "oniris-core",
    "oniris-cli",
    "oniris-jni",
]
default-members = [
    "oniris-pack",
    "oniris-core",
    "oniris-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
jni = "0.21"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
