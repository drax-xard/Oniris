name: Rust

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: Render short Opus and WAV mixes
        run: |
          # Production path: synthetic packs encoded as Ogg/Opus by default.
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- gen-test-packs /tmp/packs-opus
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- validate /tmp/packs-opus/test-rain
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- render \
            --pack /tmp/packs-opus/test-rain --pack /tmp/packs-opus/test-fire \
            --minutes 0.25 --out /tmp/oniris-opus.wav --fade-in 0.5
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- analyze /tmp/oniris-opus.wav

          # Keep the lossless fallback and the standalone encoder covered too.
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- \
            gen-test-packs /tmp/packs-wav --format wav
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- \
            encode-opus /tmp/packs-wav/test-rain/audio/rain.wav /tmp/rain.opus
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- validate /tmp/packs-wav/test-rain
          cargo run --manifest-path core/Cargo.toml -p oniris-cli -- render \
            --pack /tmp/packs-wav/test-rain --pack /tmp/packs-wav/test-fire \
            --minutes 0.25 --out /tmp/oniris-wav.wav --fade-in 0.5
